name: PostgreSQL 18.6 qualification probes
on:
  pull_request:
    branches: [main]
    paths:
      - 'multitenant-business/qualification/**'
      - '.github/workflows/postgresql-probes.yml'

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Run the disposable PostgreSQL fixture
        shell: pwsh
        run: |
          pwsh -NoProfile -File multitenant-business/qualification/run-postgres-probes.ps1 2>&1 |
            Tee-Object -FilePath postgres-probes.log
          exit $LASTEXITCODE
      - name: Preserve probe output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: postgres-probes
          path: postgres-probes.log
      - name: Run the disposable runtime-login fixture
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'postgres-runtime-probe.log'
          pwsh -NoProfile -File multitenant-business/qualification/run-postgres-probes.ps1 -RuntimePool *> $log
          if ($LASTEXITCODE -ne 0) { throw 'The runtime-login PostgreSQL probe failed.' }
          foreach ($outcome in 'Commit', 'Rollback') {
            $receipts = @(Select-String -LiteralPath $log -Pattern "^${outcome}: reused backend \d+, runtime role and exact RLS rows verified\.$")
            if ($receipts.Count -ne 1) { throw "Expected one $outcome verification receipt." }
            $receipts[0].Line
          }
